services:
  # ── Backend: Spring Boot Java 17 API ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gympilot-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - AI_MODEL=${AI_MODEL:-llama-3.3-70b-versatile}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-llama-3.2-90b-vision-preview}
      - AI_API_KEY=${AI_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-GymPilot <support@gympilot.tn>}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-gimpilot411@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-ljwulmbdzdopxpmq}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-gimpilot411@gmail.com}
      - APP_MAIL_FROM_NAME=${APP_MAIL_FROM_NAME:-GymPilot Support}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://gympilot.tn}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dvfrd0ehf}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-777366458436392}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-kjVQbJ07IMvwzvVHs9Uv819yup0}
    expose:
      - "8080"
    networks:
      - gympilot-net

  # ── Frontend: Vite React SPA ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: gympilot-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - gympilot-net

  # ── Reverse Proxy: Nginx Gateway (SSL + Caching + Rate Limiting)
  nginx:
    image: nginx:alpine
    container_name: gympilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gympilot-net

networks:
  gympilot-net:
    driver: bridge
